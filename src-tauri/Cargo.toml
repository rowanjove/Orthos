[package]
name = "lintdrop"
version = "1.0.3"
description = "极轻量配置文件格式检查器"
authors = ["Ryan"]
edition = "2021"

[lib]
name = "lintdrop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = "0.36"
jsonschema = "0.28"
dirs = "6"
