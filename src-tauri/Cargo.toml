[package]
name = "orthos"
version = "1.1.0"
description = "离线配置文件检查与安全修复工具"
authors = ["Ryan"]
edition = "2021"

[lib]
name = "orthos_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = "0.36"
jsonschema = { version = "0.28", default-features = false }
dirs = "6"

[[bench]]
name = "parser_bench"
harness = false
